[package]
name = "clatterbox"
description = "Clatterbox: mechanical keyboard sounds for every keystroke"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
default-run = "clatterbox"

[lib]
# `_lib` suffix avoids a name clash with the bin target on Windows (Tauri convention).
name = "clatterbox_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build.workspace = true

[dependencies]
clatterbox-core.workspace = true
clatterbox-audio.workspace = true
clatterbox-keyhook.workspace = true
tauri.workspace = true
tauri-plugin-single-instance.workspace = true
tauri-plugin-autostart.workspace = true
tauri-plugin-dialog.workspace = true
tauri-plugin-opener.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
parking_lot.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
