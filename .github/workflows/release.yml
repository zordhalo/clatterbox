name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { platform: macos-latest, args: "--target universal-apple-darwin" }
          - { platform: ubuntu-22.04, args: "" }
          - { platform: windows-latest, args: "" }
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v7
      - if: matrix.platform == 'ubuntu-22.04'
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libasound2-dev patchelf
      - uses: actions/setup-node@v7
        with:
          node-version: lts/*
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ". -> target"
      - run: npm ci
      - uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: v__VERSION__
          releaseName: "Clatterbox v__VERSION__"
          releaseBody: "See CHANGELOG. Unsigned builds — see README for first-run instructions."
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.args }}
      - name: Verify macOS ad-hoc signature
        if: matrix.platform == 'macos-latest'
        run: |
          APP=target/universal-apple-darwin/release/bundle/macos/Clatterbox.app
          codesign --verify --deep --strict --verbose=2 "$APP"
          codesign -dv "$APP" 2>&1 | grep -E "Signature=adhoc|Identifier|Format"
          for b in "$APP"/Contents/MacOS/*; do lipo -archs "$b"; done
